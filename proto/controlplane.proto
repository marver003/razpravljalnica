syntax = "proto3";

package controlplane;

option go_package = "/controlplane";

import "google/protobuf/empty.proto";

message NodeInfo {
  string node_id = 1;
  string address = 2;
}

message RegisterRequest {
  NodeInfo node = 1;
}

message ChainState {
  repeated NodeInfo chain = 1;
}

service ControlPlane {
  rpc RegisterNode(RegisterRequest) returns (ChainState);
  rpc GetChainState(google.protobuf.Empty) returns (ChainState);
}
